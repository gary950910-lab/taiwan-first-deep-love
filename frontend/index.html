<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術指標參數設定 | 台股選股系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            glow: 'rgba(99, 102, 241, 0.5)'
                        },
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Custom range slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        
        .indicator-card {
            transition: all 0.3s ease;
        }
        .indicator-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex items-center justify-center font-sans antialiased">

    <!-- Ambient background glow -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-brand-500/20 rounded-full blur-3xl mix-blend-screen animate-pulse-slow pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-pink-500/10 rounded-full blur-3xl mix-blend-screen animate-pulse-slow pointer-events-none" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-4xl relative z-10">
        
        <header class="mb-10 text-center">
            <div class="inline-flex items-center justify-center p-3 rounded-2xl glass-panel mb-4 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                <i class="ph ph-chart-line-up text-3xl text-brand-500"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                技術指標參數設定
            </h1>
            <p class="text-slate-400 mt-2 text-sm md:text-base">客製化您的量化交易策略核心參數</p>
        </header>

        <form id="indicatorsForm" class="space-y-6">
            
            <!-- MACD Section -->
            <div class="glass-panel rounded-2xl p-6 md:p-8 indicator-card group relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500/50 group-hover:bg-blue-500 transition-colors"></div>
                <div class="flex items-center gap-3 mb-6">
                    <i class="ph ph-chart-bar text-2xl text-blue-400"></i>
                    <h2 class="text-xl font-semibold">MACD 指數平滑異同移動平均線</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Fast Length -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            快線天期 (Fast Length)
                            <span id="macd_fast_val" class="text-brand-500 font-bold">12</span>
                        </label>
                        <input type="range" id="macd_fast" min="5" max="50" value="12" class="w-full" oninput="document.getElementById('macd_fast_val').innerText=this.value">
                    </div>
                    <!-- Slow Length -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            慢線天期 (Slow Length)
                            <span id="macd_slow_val" class="text-brand-500 font-bold">26</span>
                        </label>
                        <input type="range" id="macd_slow" min="10" max="100" value="26" class="w-full" oninput="document.getElementById('macd_slow_val').innerText=this.value">
                    </div>
                    <!-- Signal Length -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            訊號線天期 (Signal Length)
                            <span id="macd_signal_val" class="text-brand-500 font-bold">9</span>
                        </label>
                        <input type="range" id="macd_signal" min="3" max="50" value="9" class="w-full" oninput="document.getElementById('macd_signal_val').innerText=this.value">
                    </div>
                </div>
            </div>

            <!-- KD Section -->
            <div class="glass-panel rounded-2xl p-6 md:p-8 indicator-card group relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-orange-500/50 group-hover:bg-orange-500 transition-colors"></div>
                <div class="flex items-center gap-3 mb-6">
                    <i class="ph ph-waves text-2xl text-orange-400"></i>
                    <h2 class="text-xl font-semibold">KD 隨機指標</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- K Period -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            K值天期 (K Period)
                            <span id="kd_k_val" class="text-brand-500 font-bold">9</span>
                        </label>
                        <input type="range" id="kd_k" min="3" max="30" value="9" class="w-full" oninput="document.getElementById('kd_k_val').innerText=this.value">
                    </div>
                    <!-- D Period -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            D值平滑天期 (D Period)
                            <span id="kd_d_val" class="text-brand-500 font-bold">3</span>
                        </label>
                        <input type="range" id="kd_d" min="3" max="30" value="3" class="w-full" oninput="document.getElementById('kd_d_val').innerText=this.value">
                    </div>
                </div>
            </div>

            <!-- Bollinger Bands Section -->
            <div class="glass-panel rounded-2xl p-6 md:p-8 indicator-card group relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500/50 group-hover:bg-emerald-500 transition-colors"></div>
                <div class="flex items-center gap-3 mb-6">
                    <i class="ph ph-target text-2xl text-emerald-400"></i>
                    <h2 class="text-xl font-semibold">Bollinger Bands 布林通道</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Length -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            均線天期 (Length)
                            <span id="bb_len_val" class="text-brand-500 font-bold">20</span>
                        </label>
                        <input type="range" id="bb_len" min="5" max="100" value="20" class="w-full" oninput="document.getElementById('bb_len_val').innerText=this.value">
                    </div>
                    <!-- Std Dev -->
                    <div class="space-y-2">
                        <label class="flex justify-between text-sm font-medium text-slate-300">
                            標準差倍數 (Std Dev)
                            <span id="bb_std_val" class="text-brand-500 font-bold">2.0</span>
                        </label>
                        <input type="range" id="bb_std" min="1.0" max="4.0" step="0.1" value="2.0" class="w-full" oninput="document.getElementById('bb_std_val').innerText=parseFloat(this.value).toFixed(1)">
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-4 mt-8">
                <button type="button" onclick="resetForm()" class="px-6 py-3 rounded-xl font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors border border-transparent hover:border-slate-700">
                    恢復預設值
                </button>
                <button type="button" onclick="saveSettings()" class="px-6 py-3 rounded-xl font-medium text-white bg-brand-600 hover:bg-brand-500 shadow-[0_0_15px_rgba(99,102,241,0.4)] hover:shadow-[0_0_25px_rgba(99,102,241,0.6)] transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="ph ph-floppy-disk text-lg"></i>
                    儲存參數設定
                </button>
            </div>

        </form>
    </div>

    <script>
        function resetForm() {
            const defaults = {
                'macd_fast': 12, 'macd_slow': 26, 'macd_signal': 9,
                'kd_k': 9, 'kd_d': 3,
                'bb_len': 20, 'bb_std': 2.0
            };
            
            for (const [id, val] of Object.entries(defaults)) {
                const el = document.getElementById(id);
                el.value = val;
                const displayEl = document.getElementById(id + '_val');
                if (displayEl) {
                    displayEl.innerText = Number.isInteger(val) ? val : parseFloat(val).toFixed(1);
                }
            }
        }

        function saveSettings() {
            const settings = {
                macd: {
                    fast: parseInt(document.getElementById('macd_fast').value),
                    slow: parseInt(document.getElementById('macd_slow').value),
                    signal: parseInt(document.getElementById('macd_signal').value)
                },
                kd: {
                    k: parseInt(document.getElementById('kd_k').value),
                    d: parseInt(document.getElementById('kd_d').value)
                },
                bb: {
                    length: parseInt(document.getElementById('bb_len').value),
                    std: parseFloat(document.getElementById('bb_std').value)
                }
            };
            
            console.log("Saving settings to backend...", settings);
            
            // Visual feedback
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-check-circle text-lg"></i> 已儲存';
            btn.classList.add('bg-emerald-600', 'shadow-[0_0_15px_rgba(16,185,129,0.4)]');
            btn.classList.remove('bg-brand-600', 'shadow-[0_0_15px_rgba(99,102,241,0.4)]');
            
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-emerald-600', 'shadow-[0_0_15px_rgba(16,185,129,0.4)]');
                btn.classList.add('bg-brand-600', 'shadow-[0_0_15px_rgba(99,102,241,0.4)]');
            }, 2000);
        }
    </script>
</body>
</html>
