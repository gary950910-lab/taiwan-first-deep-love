<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史掃描紀錄 | 台股自動篩選器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="fade-in">
            <h1>台股自動篩選器</h1>
            <nav>
                <a href="index.html" class="btn btn-primary">歷史紀錄</a>
            </nav>
        </header>

        <main class="glass-card fade-in" style="animation-delay: 0.1s;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>歷史掃描紀錄</h2>
                <button id="refreshBtn" class="btn btn-primary">重新整理</button>
            </div>

            <div class="table-container">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>掃描日期</th>
                            <th>策略名稱</th>
                            <th>掃描時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody">
                        <!-- Records will be injected here -->
                    </tbody>
                </table>
                <div id="loading" class="spinner"></div>
                <p id="emptyState" style="display: none; text-align: center; padding: 2rem; color: var(--text-secondary);">尚無歷史掃描紀錄</p>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchRecords();
            document.getElementById('refreshBtn').addEventListener('click', fetchRecords);
        });
    </script>
</body>
</html>
