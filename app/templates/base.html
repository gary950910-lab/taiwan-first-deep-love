<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}策略回測核心系統 | 台灣第一深愛交易系統{% endblock %}</title>
    <!-- Google Fonts: Noto Sans TC, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-dark-premium text-light">

    <!-- Sticky Glassmorphism Header -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="brand-glow me-2"><i class="bi bi-cpu-fill"></i></span>
                <span class="brand-text font-outfit fw-bold tracking-wide text-gradient">DEEP LOVE TRADING</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto font-noto">
                    <li class="nav-item px-2">
                        <a class="nav-link" href="#"><i class="bi bi-funnel me-1"></i> 技術篩選 (F-01)</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" href="#"><i class="bi bi-clock-history me-1"></i> 歷史紀錄 (F-02)</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link active" href="/backtest"><i class="bi bi-graph-up-arrow me-1"></i> 策略回測 (F-03)</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" href="#"><i class="bi bi-pie-chart me-1"></i> 績效同步 (F-05)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="py-5">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto border-top border-secondary border-opacity-10 text-center text-muted font-noto">
        <div class="container">
            <p class="mb-1">© 2026 台灣第一深愛交易系統 開發團隊. All rights reserved.</p>
            <p class="small text-muted text-opacity-70">策略回測模組負責人：潘柏諺 (D1376963)</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
